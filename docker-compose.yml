services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # rq persistence

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/komalingo.db
    volumes:
      - api_data:/app/data  # jobs + uploads
      - paddle_models:/tmp/.paddleocr  # shared OCR cache
      - ./apps/api/app:/app/app
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/komalingo.db
      - TRANSLATE_PROVIDER=google  # free default
      - INPAINT_PROVIDER=cv2  # local cleanup
    volumes:
      - api_data:/app/data
      - paddle_models:/tmp/.paddleocr
      - ./apps/api/app:/app/app
    depends_on:
      - redis
      - api
    command: python -m app.workers.runner

volumes:
  redis_data:
  api_data:
  paddle_models:
